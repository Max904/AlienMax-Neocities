name: Deploy to Neocities

# Solo se ejecuta cuando tú lo pides:
#  - con el botón "Publicar en Neocities" del panel (admin/), o
#  - a mano en GitHub: Actions -> Deploy to Neocities -> Run workflow.
# Así puedes guardar cambios en GitHub, revisarlos en la copia de GitHub Pages
# y recién después subirlos a Neocities.
on:
  workflow_dispatch:

concurrency: # evita despliegues simultáneos
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Poner el tema de ntfy (secreto NTFY_TOPIC)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node .github/scripts/inject-contact.js

      # El sitio es HTML/CSS/JS estático, no hay paso de build.
      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: public
          cleanup: false            # pon true para borrar en Neocities lo que no esté en public/
          neocities_supporter: false # true si tienes cuenta supporter
          preview_before_deploy: true
