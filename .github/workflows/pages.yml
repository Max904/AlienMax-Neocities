name: Panel admin en GitHub Pages

# Publica en GitHub Pages una copia del sitio (public/) y el panel de edición (admin/).
# El panel queda en  https://TU-USUARIO.github.io/NOMBRE-DEL-REPO/admin/
# Requiere: Settings -> Pages -> Source: GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio de Pages
        run: |
          mkdir _pages
          cp -r public/. _pages/
          cp -r admin _pages/admin

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true # a veces GitHub tarda unos segundos en ver el archivo recién subido

      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (reintento)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
